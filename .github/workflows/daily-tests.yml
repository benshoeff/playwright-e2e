name: Daily E2E Tests

on:
  schedule:
    # Runs every day at 06:00 UTC (09:00 Israel time in winter, 09:00/08:00 depending on DST).
    # Adjust the hour if you want a different time of day.
    - cron: '0 6 * * *'
  workflow_dispatch: # allows manually triggering a run from the GitHub Actions tab

permissions:
  contents: write

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests against production
        run: npx playwright test --project=production tests/users.test.ts tests/permissions.test.ts tests/roles.test.ts tests/categories.test.ts tests/posts.test.ts tests/products.test.ts tests/tasks.test.ts tests/customers.test.ts tests/orders.test.ts tests/departments.test.ts tests/employees.test.ts tests/reviews.test.ts tests/projects.test.ts tests/invoices.test.ts
        env:
          DASHBOARD_DATA: '1'

      # Uploads the HTML report so you can download and inspect it
      # from the workflow run page, even when everything passes.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Merge run into history
        if: always()
        run: node scripts/merge-history.js

      # Commits the generated data (latest.json + history.json) back to main,
      # where GitHub Pages (deploy from main) serves the dashboard at /dashboard/.
      - name: Commit and push dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/dashboard-data
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
          else
            git commit -m "chore: update dashboard data"
            git push origin HEAD:main
          fi
